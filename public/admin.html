<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Адмін-панель</title>
</head>
<body>
    <h2>Адмін-панель CarFlow</h2>
    <button onclick="logout()">Вийти</button>

    <h3>Додати клієнта</h3>
    <form id="clientForm">
        <input id="cname" placeholder="ПІБ" required />
        <input id="cphone" placeholder="Телефон" required />
        <button type="submit">Створити</button>
    </form>

    <h3>Клієнти</h3>
    <ul id="clients"></ul>

    <script>
        const token = localStorage.getItem('token');
        const role = localStorage.getItem('role');
        if (!token || role !== 'admin') location.href = '/login.html';

        function logout() {
            localStorage.clear();
            location.href = '/login.html';
        }

        async function authed(url, options = {}) {
            const res = await fetch(url, {
                ...options,
                headers: {
                    'Content-Type': 'application/json',
                    Authorization: `Bearer ${token}`,
                    ...(options.headers || {}),
                },
            });
            if (res.status === 401 || res.status === 403) logout();
            return res;
        }

        async function loadClients() {
            const res = await authed('/api/clients');
            const data = await res.json();
            document.getElementById('clients').innerHTML = data
                .map((c) => `<li>#${c.id} ${c.full_name} (${c.phone})</li>`)
                .join('');
        }

        document.getElementById('clientForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            await authed('/api/clients', {
                method: 'POST',
                body: JSON.stringify({
                    full_name: document.getElementById('cname').value,
                    phone: document.getElementById('cphone').value,
                    notes: '',
                }),
            });
            document.getElementById('cname').value = '';
            document.getElementById('cphone').value = '';
            loadClients();
        });

        loadClients();
    </script>
</body>
</html>
